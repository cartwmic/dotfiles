# External resources pulled by chezmoi on apply
# https://www.chezmoi.io/user-guide/include-files-from-elsewhere/

# Accountable Review's review-map skill (wyeworks/accountable-review), both
# desktop profiles. Pinned by the commit sha in the URL: a bump is one sha edit.
# Only skills/review-map is extracted; apply_harness_config.sh links it into
# Claude, Codex, Pi and ~/.agents like any external skill.
[".local/share/agent-harness/external-skills/accountable-review"]
  type = "archive"
  url = "https://github.com/wyeworks/accountable-review/archive/ed9f8b035701669c75931fea1521d45d06b20ec8.tar.gz"
  exact = true
  stripComponents = 2
  include = ["*/skills/review-map/**"]

# Private Axon agents playbook, axon-work-computer only and only when chezmoi data names it.
# The URL lives in ~/.config/chezmoi/chezmoi.yaml (axonPlaybook.repo), never in this public repo; see
# example.chezmoi.yaml. Without the key nothing renders. Auth is the existing gh credential helper.
# apply_harness_config.sh links its skills/<skill> dirs like any external skill; the Claude SessionStart hook
# (dot_claude/modify_settings.json.tmpl) and the axon-playbook.md instruction fragment run its bin/playbook-context.
{{- $axonPlaybookRepo := dig "axonPlaybook" "repo" "" . }}
{{- if and (eq .profile "axon-work-computer") $axonPlaybookRepo }}
[".local/share/agent-harness/external-skills/axon-agents-playbook"]
  type = "git-repo"
  url = {{ $axonPlaybookRepo | toJson }}
  refreshPeriod = "24h"
  [".local/share/agent-harness/external-skills/axon-agents-playbook".pull]
    args = ["--ff-only"]
{{- end }}

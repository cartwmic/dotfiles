# Switches on the sd-ssh-unlock hook (installed to /etc/initcpio/install/ by the dotfiles). This file sorts after every other drop-in, so it
# only appends: omarchy's own HOOKS stay as they are, and a package that rewrites its drop-in cannot undo this one.
# Nothing happens on a busybox initramfs (no systemd hook), when the hook is already listed, or when dropbear is not installed;
# a missing package must not break a kernel update, and the passphrase prompt on the screen works without it.
if [[ " ${HOOKS[*]:-} " == *" systemd "* && " ${HOOKS[*]:-} " != *" sd-ssh-unlock "* ]]; then
  if [[ -x ${SSH_UNLOCK_DROPBEAR:-/usr/bin/dropbear} ]]; then
    HOOKS+=(sd-ssh-unlock)
    # mkinitcpio fails the whole image on a module name it cannot find, so each is added only when modinfo returns a real path.
    # dwc3_apple comes first: it binds the Type-C USB controllers, so without it no USB bus exists in early boot and the cable's driver has nothing to bind to.
    # (Its dependencies dwc3, xhci-plat-hcd, phy-apple-atc and tps6598x are already in omarchy's image; usbcore and roles are built in.)
    for _ssh_unlock_module in dwc3_apple r8152 r8153_ecm cdc_ether usbnet mii; do
      _ssh_unlock_path=$(modinfo -k "${KERNELVERSION:-$(uname -r)}" -F filename "$_ssh_unlock_module" 2>/dev/null) || continue
      [[ $_ssh_unlock_path == /* ]] && MODULES+=("$_ssh_unlock_module")
    done
    unset _ssh_unlock_module _ssh_unlock_path
  else
    echo "sd-ssh-unlock: dropbear is not installed; the initramfs gets no SSH unlock" >&2
  fi
fi

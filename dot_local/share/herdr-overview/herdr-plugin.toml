id = "overview"
name = "Herdr Overview"
version = "0.1.0"
min_herdr_version = "0.9.1"
description = "Shared native-ID overview model and themed session pane for Herdr 0.9.1."
platforms = ["macos", "linux"]

[[startup]]
command = ["node", "index.mjs", "startup"]

[[actions]]
id = "reconcile"
title = "Reconcile overview"
description = "Reconcile native session state without opening a view."
command = ["node", "index.mjs", "reconcile"]

[[actions]]
id = "refresh_names"
title = "Refresh automatic names"
description = "Passively refresh stable session names without recap coordination or opening a view."
command = ["node", "index.mjs", "refresh-names"]

[[actions]]
id = "open"
title = "Open overview map"
description = "Open the passive temporary native workspace map."
command = ["node", "index.mjs", "open"]

[[actions]]
id = "auto_name_pane"
title = "Return pane label to automatic naming"
description = "Explicitly let automatic naming manage the selected pane label again."
contexts = ["pane"]
command = ["node", "index.mjs", "auto-name-pane"]

[[actions]]
id = "auto_name_tab"
title = "Return tab label to automatic naming"
description = "Explicitly let automatic naming manage the selected tab label again."
contexts = ["tab"]
command = ["node", "index.mjs", "auto-name-tab"]

[[panes]]
id = "overview"
title = "Herdr Overview"
placement = "popup"
width = "100%"
height = "100%"
command = ["node", "index.mjs", "overview"]

[[events]]
on = "workspace.created"
command = ["node", "index.mjs", "event"]

[[events]]
on = "workspace.updated"
command = ["node", "index.mjs", "event"]

[[events]]
on = "workspace.closed"
command = ["node", "index.mjs", "event"]

[[events]]
on = "workspace.renamed"
command = ["node", "index.mjs", "event"]

[[events]]
on = "workspace.moved"
command = ["node", "index.mjs", "event"]

[[events]]
on = "workspace.reordered"
command = ["node", "index.mjs", "event"]

[[events]]
on = "tab.created"
command = ["node", "index.mjs", "event"]

[[events]]
on = "tab.closed"
command = ["node", "index.mjs", "event"]

[[events]]
on = "tab.renamed"
command = ["node", "index.mjs", "event"]

[[events]]
on = "tab.moved"
command = ["node", "index.mjs", "event"]

[[events]]
on = "pane.created"
command = ["node", "index.mjs", "event"]

[[events]]
on = "pane.closed"
command = ["node", "index.mjs", "event"]

[[events]]
on = "pane.moved"
command = ["node", "index.mjs", "event"]

[[events]]
on = "pane.exited"
command = ["node", "index.mjs", "event"]

[[events]]
on = "pane.agent_detected"
command = ["node", "index.mjs", "event"]

[[events]]
on = "pane.agent_status_changed"
command = ["node", "index.mjs", "event"]

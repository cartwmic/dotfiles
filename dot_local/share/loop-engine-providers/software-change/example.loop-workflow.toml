# Copy to `.loop-workflow.toml` at the root of a repository you want to drive
# with the software-change provider, i.e. the directory passed as the run's
# `work_root` input.
#
# Every semantic judge reads this file. Schema, review and checkpoint gates read
# JSON artifacts under `artifact_root` instead.
#
# Unknown keys are REJECTED, not ignored, at every level. A misplaced key —
# `plan_axes` under a `[validation]` table, say — fails the gate with a parse
# error naming the line, rather than silently running defaults.
#
# This file is read fresh on every gate invocation and is NOT frozen into the
# run snapshot: it describes the repository, not the run. Correcting it
# mid-run is legitimate, and every gate records what it actually used in its
# evidence.

schema_version = 1

# ---------------------------------------------------------------- judge
#
# Judgments are cached under `artifact_root/.judgments/` and replayed when the
# same document is requested again, so changing `model` here also re-opens
# everything judged under the previous one.
#
# Required as soon as a run's stored graph includes the `intent-semantic` gate.
# Without it that gate cannot reach a verdict, and the attempt is an ERROR
# (exit 1) rather than a rejection — a judgment that did not happen is never
# reported as a verdict on the author's document.

[judge]
# Model pattern for the per-axis judges, as accepted by `pi --model`.
#
# PREFER A DIRECT-API PROVIDER over a bridged one. A bridge that shells out to
# another coding agent pays that agent's whole startup on every judge call, and
# the cost is not linear in the number of axes. Measured on this machine, judging
# one plan across seven axes:
#
#   openai-codex/gpt-5.6-sol        1m38s   every axis determinate
#   claude-bridge/claude-haiku-4-5  25m+    most axes timed out
#
# The bridged run did not merely take longer -- it failed, as `evaluation_error`,
# which reads like a broken provider rather than a saturated one. A bridge also
# cannot be relied on to honour `--system-prompt`: the agent behind it keeps its
# own persona and context files, which is why rubrics are sent in the user
# message as well.
model = "openai-codex/gpt-5.6-sol"

# Deciding judge. Sees the document plus every axis finding and issues the
# binding verdict. Defaults to `model`. A stronger model here is usually the
# best value in this file: it is one call, and it can overturn a pedantic axis.
consensus_model = "openai-codex/gpt-5.6-sol"

# Judges run with extension DISCOVERY disabled so no ambient extension —
# memory, MCP, telemetry — can reach a judgment. Providers that arrive via an
# extension must therefore be named explicitly here. Omit this key entirely if
# your model comes from a built-in provider, as the codex models above are.
# extensions = ["~/.pi/agent/git/github.com/cartwmic/pi-claude-bridge/index.ts"]

# How many axis judges may be in flight at once. Default 3.
#
# Axis judges are separate processes, and past a handful in flight they stop
# behaving like parallel work. Raise this only if your judge CLI is a thin API
# client; leave it low, or lower it to 1, for anything that starts another agent
# behind it.
# max_parallel_axes = 3

# Wall-clock budget for the whole judgment: axis judges run concurrently, then
# the deciding judge runs. Capped by the provider registration timeout, which
# defaults to 60s and is far too small for this. Raise it:
#   loop-engine provider update software-change --exec <PATH> --timeout 900
timeout_seconds = 300

# Optional. Omit to run every axis this provider build implements.
# There are three axis vocabularies, one per judged document, and they are
# deliberately disjoint: `axes` selects intent axes, `design_axes` design axes,
# `plan_axes` plan axes. A name put under the wrong key is rejected by name
# rather than silently ignored.
#   solution-agnostic   does intent encode a chosen solution?
#   outside-verifiable  can every acceptance line be checked from outside?
#   scope-fenced        do the fences actually constrain what happens next?
#   constraints-are-limits  are `constraints` real external limits?
#   problem-grounded    does `problem` state consequence, not code facts?
# Axis subsets are per judged document, and the vocabularies are disjoint.
# design_axes = [
#   "intent-faithful",
#   "acceptance-covered",
#   "structural-not-procedural",
#   "decisions-justified",
#   "risk-honest",
# ]

# axes = ["solution-agnostic", "outside-verifiable"]

# plan_axes selects among the seven `plan.json` axes:
#   task-sized            can a fresh worker tell when to stop, in both
#                         directions -- neither inventing the change nor being
#                         handed a keystroke
#   context-sufficient    oriented without being fenced
#   done-observable       could someone who did not do the work decide it
#   checkpoint-meaningful could the checkpoint catch its own phase failing
#   decision-free         does the plan re-decide the approved design
#   design-faithful       would the tasks actually build the cited elements
#   dependencies-honest   are the declared dependencies the real ones
#
# Seven axes plus the decider is eight model calls per attempt. Trimming this
# list is the main cost lever; `design-faithful` and `decision-free` are the two
# that catch a plan delivering the wrong change, so cut them last.
# plan_axes = ["task-sized", "done-observable", "design-faithful"]

# implementation_axes selects among the axes of the FINAL judgment, which runs
# on `implementation-review --approved--> end` and compares the cumulative diff
# against `intent.json`:
#   intent-delivered   would every acceptance line now be true, and is the
#                      problem actually gone
#
# There is deliberately NO key here for the per-phase checkpoint axes. Those are
# declared by `plan.json`, phase by phase, under `checkpoint.review.axes`,
# because which phases are worth judging and on what is a property of the change
# rather than of the repository — a setting here could not name a phase. The
# vocabulary a plan may select from is `tasks-actually-done`, `no-scope-creep`
# and `design-faithful`, and `plan-ready` rejects anything else by name.
# implementation_axes = ["intent-delivered"]

# Optional thinking level passed through to the judge CLI.
# thinking = "low"

# Optional. argv of the judge CLI; `run[0]` is the executable. Defaults to
# ["pi"]. Never passed through a shell.
# command = ["pi"]

# Validation commands used to live here, in a [validation] table. They now live
# in `plan.json`, one list per phase `checkpoint`, because what gets validated is
# a property of the change being made rather than of the repository it is made
# in: a phase adding persistence and a phase adding an interface do not need the
# same checks. The plan is reviewed and approved, so the commands are reviewed
# with it.
#
# Unknown tables are REJECTED, so a leftover [validation] table now fails the
# gate with a parse error naming the line rather than being ignored.

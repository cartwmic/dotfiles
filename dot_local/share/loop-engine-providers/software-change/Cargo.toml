[package]
name = "software-change-provider"
version = "1.0.0"
edition = "2021"
description = "loop-engine protocol v1 provider: software-change lifecycle with artifact review gates and command validation gates"
publish = false

[[bin]]
name = "software-change"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
toml = { version = "0.8", default-features = false, features = ["parse"] }

[profile.release]
strip = true

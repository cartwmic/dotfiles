<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Send Michael something to look into</title>
<style>
@font-face{font-family:"Inter";src:url("/vendor/fonts/inter.woff2") format("woff2");font-weight:100 900;font-display:swap}
@font-face{font-family:"Cormorant Garamond";src:url("/vendor/fonts/cormorant-garamond-500.woff2") format("woff2");font-weight:400 600;font-display:swap}
:root{
  color-scheme:light dark;
  --canvas:light-dark(#f9f8f6,#1c1a19);
  --primary:#b5523b;--primary-active:#9c4330;
  --primary-disabled:light-dark(#e6e0d9,#3c3734);
  --surface-card:light-dark(#ebe6e0,#2b2826);
  --hairline:light-dark(#e6e0d9,#3c3734);
  --ink:light-dark(#1a1716,#f5f1ee);
  --body:light-dark(#403b38,#cec6c1);
  --muted:light-dark(#6e6863,#a69e98);
  --success-text:light-dark(#2f7d43,#7fcf92);
  --warning-text:light-dark(#8a6400,#e3b341);
  --error-text:light-dark(#b23b3b,#e88080);
  --on-primary:#fff;
  --focus-ring:0 0 0 3px light-dark(rgb(181 82 59 / 15%),rgb(181 82 59 / 35%));
  --font-display:"Cormorant Garamond","EB Garamond",Garamond,serif;
  --font-body:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-family:var(--font-body);color:var(--ink);background:var(--canvas)}
:root[data-scheme="light"]{color-scheme:light}
:root[data-scheme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;font:16px/1.55 var(--font-body);color:var(--ink);background:var(--canvas)}
main{max-width:640px;margin:auto;padding:32px 20px 64px}
h1,h2{font-family:var(--font-display);font-weight:400;letter-spacing:-.02em;margin:0 0 8px}
h1{font-size:clamp(32px,8vw,48px);line-height:1.05}
h2{font-size:28px;line-height:1.2;margin-top:40px}
p{color:var(--body);margin:0 0 16px}
label{display:block;font-size:14px;font-weight:500;margin:20px 0 6px}
textarea,input{width:100%;background:var(--canvas);color:var(--ink);border:1px solid var(--hairline);border-radius:8px;padding:10px 14px;font:inherit}
textarea{min-height:120px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--primary);box-shadow:var(--focus-ring)}
button{min-height:44px;padding:12px 20px;border:1px solid var(--primary);border-radius:8px;background:var(--primary);color:var(--on-primary);font:inherit;font-size:14px;font-weight:500;cursor:pointer;margin-top:20px;width:100%}
button:active{background:var(--primary-active)}
button:disabled{background:var(--primary-disabled);color:var(--muted);border-color:var(--primary-disabled);cursor:default}
#msg{min-height:24px;margin-top:12px;font-size:14px}
.ok{color:var(--success-text)}.bad{color:var(--error-text)}
.item{background:var(--surface-card);border-radius:12px;padding:16px 20px;margin-bottom:12px}
.item .t{white-space:pre-wrap;overflow-wrap:anywhere;color:var(--ink);margin:0 0 4px}
.item .a{color:var(--muted);font-size:14px;margin:0 0 8px;overflow-wrap:anywhere}
.item .r{color:var(--body);font-size:14px;margin:8px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}
.meta{display:flex;gap:12px;align-items:center;font-size:13px;color:var(--muted)}
.st{font-weight:500}
.st.new{color:var(--warning-text)}.st.picked{color:var(--muted)}.st.answered{color:var(--success-text)}
</style></head>
<body><main>
<h1>Send Michael something to look into</h1>
<p>Paste a link or write a note. It goes to Michael's helper, who looks into it and answers.</p>
<form id="f">
  <label for="text">A link or a note</label>
  <textarea id="text" required></textarea>
  <label for="ask">What do you want to know? (optional)</label>
  <input id="ask" type="text">
  <button id="send" type="submit">Send</button>
  <div id="msg" role="status" aria-live="polite"></div>
</form>
<h2>Your past items</h2>
<div id="list"><p>Loading…</p></div>
</main>
<script>
const LABEL={new:"New",picked_up:"Picked up",answered:"Answered"};
const CLASS={new:"new",picked_up:"picked",answered:"answered"};
const when=ms=>new Date(ms).toLocaleString([], {dateStyle:"medium",timeStyle:"short"});
const el=(tag,cls,text)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(text!==undefined)e.textContent=text;return e};
(async()=>{
  const db=await claude.use("db");
  const col=db.collection("submissions");
  const list=document.getElementById("list");
  col.orderBy("created","desc").limit(100).onSnapshot(snap=>{
    list.textContent="";
    if(snap.empty){list.append(el("p","", "Nothing sent yet."));return}
    for(const d of snap.docs){
      const v=d.data(), card=el("div","item");
      card.append(el("p","t",v.text));
      if(v.ask)card.append(el("p","a","Question: "+v.ask));
      const meta=el("div","meta");
      meta.append(el("span","st "+(CLASS[v.status]||""),LABEL[v.status]||v.status),el("span","",when(v.created)));
      card.append(meta);
      if(v.answer)card.append(el("p","r",v.answer));
      list.append(card);
    }
  },e=>{list.textContent="";list.append(el("p","bad","Could not load the list: "+e.message))});
  const f=document.getElementById("f"),msg=document.getElementById("msg"),btn=document.getElementById("send");
  f.addEventListener("submit",async ev=>{
    ev.preventDefault();
    const text=document.getElementById("text").value.trim(),ask=document.getElementById("ask").value.trim();
    if(!text)return;
    btn.disabled=true;msg.className="";msg.textContent="Sending…";
    try{
      await col.add({text,ask,status:"new",created:Date.now()});
      f.reset();msg.className="ok";msg.textContent="Received. Michael's helper will pick it up soon.";
    }catch(e){msg.className="bad";msg.textContent="Could not send: "+e.message}
    btn.disabled=false;
  });
})().catch(e=>{document.getElementById("list").textContent="Could not start: "+e.message});
</script></body></html>

extra-keys-text-all-caps = false
# Fork: faint dividers between extra keys.
extra-keys-border = true
extra-keys = [[{key: 'ESC', display: 'esc 🗺️', popup: {macro: 'CTRL b O', display: 'overview'}}, {key: 'CTRL', display: 'ctrl 🎛️', popup: {macro: 'CTRL b SPACE', display: 'palette'}}, {key: 'ALT', display: 'alt ^O', popup: {macro: 'CTRL o', display: 'ctrl-o'}}, 'UP', 'KEYBOARD', 'ENTER'], [{key: 'SHIFT', display: 'shift ^P', popup: {macro: 'CTRL p', display: 'ctrl-p'}}, {key: 'TAB', display: 'tab ⇧⇥', popup: {macro: 'SHIFT TAB', display: 'S-tab'}}, 'LEFT', 'DOWN', 'RIGHT', {macro: 'CTRL ]', display: '^] ❌', popup: {macro: 'CTRL b x', display: 'close pane'}}]]
terminal-toolbar-height = 1
terminal-toolbar-extra-keys-height = 0.70
# On the phone, turn off Settings > Termux > Terminal I/O > Soft Keyboard Enabled once.
hide-soft-keyboard-on-startup = true
soft-keyboard-toggle-behaviour = enable/disable
allow-external-apps = true

# Fork: Volume Up = previous session; Volume Down = next session.
# Use virtual for Ctrl/Fn modifiers, or volume for Android volume control.
volume-keys = sessions
shortcut.previous-session = ctrl + 1
shortcut.next-session = ctrl + 2

# Place this file in ~/.config/chezmoi
#
# Profiles:
#   personal           — full Mac/Linux desktop + agent harness
#   axon-work-computer — work laptop (subset of personal)
#   termux             — Android Termux (SSH jump host + .termux + jump scripts)
#
# Termux bootstrap (phone-only; needs Termux:API app): termux/bootstrap-phone.py provision writes
# the phone's chezmoi.yaml (profile "termux" plus the termux sshHosts keys, read from 1Password on
# the Mac), then runs `chezmoi init --apply https://github.com/cartwmic/dotfiles.git` on the phone.
# By hand, write that file first: init --apply stops while the termux keys (sshHosts.server, macbook,
# laptop, macKvm, whonixGw, whonixWs; docs/profiles.md "Local data keys") are missing.
# See termux/README.md for ops_... clipboard SSH key provision.
data:
  profile: "personal"
  # Coordinator and Retro daemons: one opt-in flag each; apply sets up and starts them. See README "Instances".
  # instances:
  #   coordinator: {enabled: true}
  #   retro: {enabled: true, channelId: "<#retro channel id>", opItem: "op://VAULT/ITEM/bot_token"}
  # axon-work-computer: only the Matrix coordinator, same flag: instances: {coordinator: {enabled: true, repo: /Users/you/coordinator-work}}
  # Scheduled QMD refresh (macOS, personal and axon-work-computer; docs/qmd.md "Scheduled refresh"). On by default, every 60 minutes.
  # Change either value and run chezmoi apply: the LaunchAgent is rewritten and reloaded, or removed when disabled.
  # qmd:
  #   refresh: {enabled: true, intervalMinutes: 60}   # 15 to 1440; enabled: false removes the agent
  #   (add cleanup: false to stop the daily `qmd cleanup` that qmd-refresh runs at most once per 24 h; docs/qmd.md "Daily cleanup")
  # Always-on agent-events metrics (macOS; dot_local/share/agent-events/README.md "Always on"). On by default on personal only.
  # enabled: false unloads and removes the LaunchAgent on the next apply. A bad value fails the apply.
  # agentEvents:
  #   enabled: true
  #   machine: work    # the machine label on every series: personal / work by default
  #   endpoint: https://otel-collector.internal.cartwmic.com/v1/metrics
  #   engine: python   # python (default) or ts: what ~/.local/bin/agent-events runs. ts needs agentKit.enabled; a render fails without it
  # Pinned agent-kit install for the agent-traces CLI (~/.local/bin/agent-traces; dot_local/share/agent-kit). On by default on personal only.
  # The install is `npm ci` from GitHub Packages with `gh auth token`. enabled: false (or any other profile) leaves the wrapper exiting 3.
  # agentKit:
  #   enabled: true
  # Traces stage 2 shadow tooling (shadow_py_run.py, cache_ref.py, reference.sha256 beside the frozen collector in ~/.local/share/agent-events) and its
  # three LaunchAgents: local.agent-traces-shadow (TS), local.agent-traces-shadow-py (Python control), local.agent-traces-seed (seeded failures only).
  # On by default on personal only. Only the TS arm is loaded by the apply; the others are started by hand. enabled: false unloads and removes all three.
  # agentTracesShadow:
  #   enabled: true
  #   machine: test-personal   # the arms send as <machine>-ts and <machine>-py; the seed arm is test-seed
  #   arm: [ts, py, seed]      # default all three with agentKit on, else [py]; ts and seed need agentKit.enabled
  # axon-work-computer only: clone the private Axon agents playbook (placeholder; use your own account's URL). Omit the key and nothing is cloned.
  # axonPlaybook: {repo: "https://github.com/<account>/axon-agents-playbook.git"}
  # Machine-specific names and addresses. Placeholders only; the full list per profile is docs/profiles.md, "Local data keys".
  # axon-work-computer profile (all six required; a missing key fails the render and names it):
  # workGitHost: "git.example.com"
  # workGlmBaseUrl: "https://gateway.example.com"
  # workGlmKeyRef: "op://<vault>/<item>/credential"
  # workGlmModelId: "<model-id>"
  # workAwsProfile: "<aws-profile>"
  # workDevportalMcpUrlRef: "op://<vault>/<item>/credential"
  # personal profile (required; a missing key fails the render and names it):
  # rustdesk: {server: "192.0.2.1"}
  # sshHosts:
  #   server: {address: "192.0.2.10", user: "<user>"}
  #   laptop: {address: "192.0.2.11", user: "<user>"}
  #   kgate: {address: "192.0.2.12", user: "<user>"}
  #   dailyPhone: {wgAddress: "198.51.100.6", lanAddress: "192.0.2.22", user: "<user>"}
  #   sshPhone: {wgAddress: "198.51.100.8", lanAddress: "192.0.2.23", user: "<user>"}

hooks:
  read-source-state:
    pre:
      command: ".local/share/chezmoi/.install-password-manager.sh"

# Place this file in ~/.config/chezmoi
#
# Profiles:
#   personal           — full Mac/Linux desktop + agent harness
#   axon-work-computer — work laptop (subset of personal)
#   termux             — Android Termux (SSH jump host + .termux + jump scripts)
#
# Termux bootstrap (phone-only; needs Termux:API app):
#   pkg install -y chezmoi git openssh coreutils termux-api
#   mkdir -p ~/.config/chezmoi
#   cat > ~/.config/chezmoi/chezmoi.yaml <<'EOF'
#   data:
#     profile: "termux"
#   EOF
#   # Repo is public — no GitHub auth required for init.
#   chezmoi init --apply https://github.com/cartwmic/dotfiles.git
#   See termux/README.md for ops_... clipboard SSH key provision.
data:
  profile: "personal"
  # Termux SSH alias of THIS machine. ntfy stamps it on Click `?host=` and the
  # notification title so a phone tap can focus the matching Termux session and
  # ssh the right ControlMaster. Examples: remote, cartwmic-server, macbook, laptop.
  # jumpSshHost: "macbook"
  #
  # Required on personal and axon-work-computer: this machine's included
  # Cursor subscription cap in dollars. Must be a positive number. Chezmoi
  # interpolates it as the Cursor metricSet cap (remaining on personal,
  # spend on work). There is no compiled default; omitting the key fails
  # template render so Cursor is not silently dropped from the usage line.
  # Set cursorSubscriptionCapDollars in the machine-local
  # ~/.config/chezmoi/chezmoi.yaml — do not copy a numeric value here.

hooks:
  read-source-state:
    pre:
      command: ".local/share/chezmoi/.install-password-manager.sh"

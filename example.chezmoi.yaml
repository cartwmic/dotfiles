# Place this file in ~/.config/chezmoi
#
# Profiles:
#   personal           — full Mac/Linux desktop + agent harness
#   axon-work-computer — work laptop (subset of personal)
#   termux             — Android Termux (SSH jump host + .termux + jump scripts)
#
# Termux bootstrap (phone-only; needs Termux:API app): termux/bootstrap-phone.py provision writes
# the phone's chezmoi.yaml (profile "termux" plus the termux sshHosts keys, read from 1Password on
# the Mac), then runs `chezmoi init --apply https://github.com/cartwmic/dotfiles.git` on the phone.
# By hand, write that file first: init --apply stops while the termux keys (sshHosts.server, macbook,
# laptop, macKvm, whonixGw, whonixWs; docs/profiles.md "Local data keys") are missing.
# See termux/README.md for ops_... clipboard SSH key provision.
data:
  profile: "personal"
  # Container mode, the agent host pod only (personal profile on Linux; docs/container-mode.md): no desktop, systemd or launchd, the lean tool set, Claude through the in-cluster cliproxy.
  # container:
  #   enabled: true
  #   cliproxyUrl: http://cliproxyapi.cliproxyapi.svc.cluster.local   # default
  #   cliproxyKeyFile: /run/secrets/cliproxy/api-key                  # default; the file holds the key
  # The pod also sets sshHosts.kgate (below), as in the homelab repo's k8s/agent-host configmap: container mode writes ~/.config/kgate/host from it, and kgate reaches the cluster over that ssh host.
  #   sshHosts: {kgate: {address: "192.0.2.12", user: "<user>"}}   # a top-level key beside container, not under it
  # Coordinator daemon: one opt-in flag; apply sets up and starts it. See README "Instances".
  # instances:
  #   coordinator: {enabled: true}
  # axon-work-computer: only the Matrix coordinator, same flag: instances: {coordinator: {enabled: true, repo: /Users/you/coordinator-work}}
  # Scheduled QMD refresh (macOS, personal and axon-work-computer; docs/qmd.md "Scheduled refresh"). On by default, every 60 minutes.
  # Change either value and run chezmoi apply: the LaunchAgent is rewritten and reloaded, or removed when disabled.
  # qmd:
  #   refresh: {enabled: true, intervalMinutes: 60}   # 15 to 1440; enabled: false removes the agent
  #   (add cleanup: false to stop the daily `qmd cleanup` that qmd-refresh runs at most once per 24 h; docs/qmd.md "Daily cleanup")
  # session-keepalive (macOS; docs/session-keepalive.md). A general keepalive for VPNs and other sessions: a list
  # of checks, each with a probe, an optional refresh action and a mode. The block's presence turns the feature on;
  # leave it out (or remove it) and the agent is not deployed, or unloaded and removed on the next apply. The values
  # are machine-specific and stay in this local file, never in this public repo.
  # sessionKeepalive:
  #   intervalSeconds: 120           # the launchd StartInterval of the one agent, 30 to 3600
  #   checks:
  #     - label: "Example VPN"       # shown in notifications; also the state filename
  #       kind: viscosity
  #       mode: refresh              # alert (the default) | refresh; refresh tells Viscosity to disconnect and
  #                                  # connect again at most once per 15 minutes, which can open the connection's
  #                                  # browser sign-in (the owner's credentials), so refresh is always explicit
  #       connection: "Example VPN"  # the Viscosity connection name, exactly as Viscosity lists it
  #       host: git.example.com      # probed over HTTPS through the tunnel; any HTTP status counts as reachable
  #     - label: example-cloud       # a command check: any session whose health is one command's exit code
  #       kind: command
  #       mode: alert                # MFA- or Okta-gated sessions stay alert-only: the tool never types, stores
  #                                  # or pipes a password
  #       probe: aws sts get-caller-identity --profile example
  #       intervalSeconds: 600       # optional per-check minimum interval between runs, 30 to 3600
  #       alertCommand: /Users/you/bin/page-me  # optional per-check extra command on alert (SESSION_KEEPALIVE_REASON
  #                                             # and SESSION_KEEPALIVE_CHECK are set)
  # Always-on agent-events metrics (macOS; dot_local/share/agent-events/README.md). On by default on personal only.
  # enabled: false unloads and removes the LaunchAgent on the next apply. A bad value fails the apply.
  # agentEvents:
  #   enabled: true
  #   machine: work    # the machine label on every series: personal / work by default
  #   endpoint: https://otel-collector.internal.cartwmic.com/v1/metrics
  #   export: false    # build the local database but send nothing (a machine whose launchd node cannot reach the collector: macOS Local Network block, symptom EHOSTUNREACH); default true
  #   engine: ts       # ts is the only engine (agent-events runs the agent-kit port); kept so existing data files render. python fails the render. ts needs agentKit.enabled
  # Pinned agent-kit install for the agent-traces CLI (~/.local/bin/agent-traces; dot_local/share/agent-kit). On by default on personal only.
  # The install is `npm ci` from GitHub Packages with `gh auth token`. enabled: false (or any other profile) leaves the wrapper exiting 3.
  # agentKit:
  #   enabled: true
  # gh wrapper (docs/gh-wrapper.md): the one gh wrapper is installed on both desktop profiles. enabled switches its layers (call log, watch interval, budget guard).
  # Default: true on personal, false on axon-work-computer. leakGuard (axon-work-computer only; docs/leak-guard.md) lists the repositories its text check guards.
  # ghBudget:
  #   enabled: true
  # A personal Mac with no Workshop SSD (docs/agent-scratch.md) sets enabled: false; every other machine leaves it out (default true).
  # workshop:
  #   enabled: true
  # axon-work-computer only: clone the private Axon agents playbook (placeholder; use your own account's URL). Omit the key and nothing is cloned.
  # axonPlaybook: {repo: "https://github.com/<account>/axon-agents-playbook.git"}
  # Machine-specific names and addresses. Placeholders only; the full list per profile is docs/profiles.md, "Local data keys".
  # axon-work-computer profile (all six required; a missing key fails the render and names it):
  # workGitHost: "git.example.com"
  # workGlmBaseUrl: "https://gateway.example.com"
  # workGlmKeyRef: "op://<vault>/<item>/credential"
  # workGlmModelId: "<model-id>"
  # workAwsProfile: "<aws-profile>"
  # workDevportalMcpUrlRef: "op://<vault>/<item>/credential"
  # personal profile (required; a missing key fails the render and names it):
  # rustdesk: {server: "192.0.2.1"}
  # sshHosts:
  #   server: {address: "192.0.2.10", user: "<user>"}
  #   laptop: {address: "192.0.2.11", user: "<user>"}
  #   kgate: {address: "192.0.2.12", user: "<user>"}
  #   kgateFallback:   # optional: more control planes, tried in order after kgate
  #     - {address: "192.0.2.13", user: "<user>"}
  #   dailyPhone: {wgAddress: "198.51.100.6", lanAddress: "192.0.2.22", user: "<user>"}
  #   sshPhone: {wgAddress: "198.51.100.8", lanAddress: "192.0.2.23", user: "<user>"}
  # kgate on a second Kubernetes cluster reached through kubectl (any profile; docs/kgate.md, "A second cluster"). The values are TOML text, written to
  # ~/.config/kgate/clusters/<name>.toml and ~/.config/kgate/profiles/<name>.toml by run_onchange_after_45_kgate_cluster_files.sh.tmpl. Omit the key and nothing is written (files written earlier stay; delete them by hand).
  # kgate:
  #   clusters:
  #     example: |
  #       kind = "kubectl"
  #       kubeconfig = "~/.kube/kgate-example"
  #       context = "example-ctx"
  #       namespace = "jobs"
  #       registries = ["registry.example"]
  #       tree_roots = ["Users", "Volumes", "private"]
  #       user = "65532:65532"
  #       deadline_s = 7200
  #       [pod_labels]
  #       "example.org/owner" = "team-a"
  #   profiles:
  #     example-job: |
  #       cluster = "example"
  #       image = "registry.example/ci/runner:1@sha256:<64 hex>"
  #       cpu = 2
  #       memory = "4Gi"
  # axon-work-computer only: the leak-guard git hooks and the gh wrapper (docs/leak-guard.md). Terms are regexes matched case-insensitively against the added lines of every commit and push;
  # the context tells Claude what counts as a work detail. Omit the key and no hook or file is installed. The real terms stay in this file, never in the repo.
  # leakGuard:
  #   terms: ["fooco", "fooco-internal\\.example", "project-bar"]
  #   context: |
  #     Fooco is the employer. A work detail is anything that names it, its hosts, its repositories, its clusters or its registries.
  #   repos: ["fooco-dev/some-public-repo"]   # the repositories the gh wrapper guards (host/owner/name off github.com); empty or omitted: no wrapper
  # axon-work-computer only: the MCP tool that the mcp-ticket-lookup helper runs for known-limits-check's
  # ticket-key lookup (docs/profiles.md, Optional keys). A work detail: set it here, never in the repo.
  # workEnv:
  #   mcpTool: "mcp__example_tracker__get_issue"

hooks:
  read-source-state:
    pre:
      command: ".local/share/chezmoi/.install-password-manager.sh"

# kgate profile for the dotfiles heavy suites (tests/heavy-gate, about 9 minutes, and tests/workstream-rank). Contract: docs/kgate.md.
# Run: run-and-wake -- kgate -- sh -c 'python3 -m unittest discover -s tests/heavy-gate && python3 -m unittest discover -s tests/workstream-rank'
image  = "ghcr.io/cartwmic/kgate@sha256:37c05c3427900dd1fc3852e614421da8ea7610cd48ec4781e49f84ce6ebb06a1"
# CPU 1 (was 2): job average 0.09 core, p95 0.19, max 0.23; the suites mostly wait and there is no CPU limit.
cpu    = 1
memory = "512Mi"
memory_limit = "1Gi"

[tools]
python3 = "3.14.6"

# GitHub's ci.yml runs these suites: kgate refuses them on a clean tree at a commit where that run was green (playbook 83fbe006).
[github_ci]
workflow = "ci.yml"
suites = ["discover -s tests/heavy-gate", "discover -s tests/workstream-rank", "scripts/ci-linux.sh"]

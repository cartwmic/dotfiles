# kgate profile for the dotfiles heavy suites (tests/heavy-gate, about 9 minutes, and tests/workstream-rank). Contract: docs/kgate.md.
# Run: run-and-wake -- kgate -- sh -c 'export PYTHONDONTWRITEBYTECODE=1; python3 -m unittest discover -s tests/heavy-gate && python3 -m unittest discover -s tests/workstream-rank'
image  = "ghcr.io/cartwmic/kgate@sha256:c56793cfb5dd8d5fc61aa8ebf62be437977743ebc359ed5720ffbe5c311148a0"
# CPU 1 (was 2): job average 0.09 core, p95 0.19, max 0.23; the suites mostly wait and there is no CPU limit.
cpu    = 1
memory = "512Mi"
memory_limit = "1Gi"

[tools]
python3 = "3.14.6"

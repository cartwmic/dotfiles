name: CI

# Fast, secret-free tests only: pi-mcp-lazy (incl. render), pi-idle-rss seam tests, mise tasks.
# Also: Pi AGENTS.md render, release-tag skill import, session-recap store tests (fake backends only),
# agent-events tests (synthetic session files only).
# Not run here: *proof.py / journey scripts that drive a real Pi, Herdr or phone, and
# anything needing 1Password or other secrets (tests/native-mcp, tests/pi-recap, tests/standing-reminder, ...).

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install chezmoi (render test uses it)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.71.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Agent-harness render and pi-mcp-lazy tests
        run: python3 -m unittest discover -s tests/pi-mcp-lazy -v
      - name: Pi idle-RSS seam tests
        run: python3 -m unittest discover -s tests/pi-idle-rss -v
      - name: Pi AGENTS.md render (personal vs work profile)
        run: python3 -m unittest discover -s tests/pi-agents-render -v
      - name: Pi settings render (compaction)
        run: python3 -m unittest discover -s tests/pi-settings-render -v
      - name: Release-tag skill import tool
        run: python3 -m unittest discover -s tests/release-skills -v
      - name: Capability-tier resolver tests
        run: python3 -m unittest discover -s tests/capability-tiers -v
      - name: Session-recap store tests
        run: python3 -m unittest discover -s dot_local/share/session-recap -p 'test_*.py' -v
      - name: Pi op shim tests (fake op, no token)
        run: python3 -m unittest discover -s tests/pi-op-shim -v
      - name: heavy-gate tests (fake host figures, any OS)
        run: python3 -m unittest discover -s tests/heavy-gate -v
      - name: workstream-rank tests (golden fixture, real script)
        run: python3 -m unittest discover -s tests/workstream-rank -v
      - name: Agent-events tests
        run: python3 -m unittest discover -s dot_local/share/agent-events -p 'test_*.py' -v
      - name: Instances render, ignore and reconcile-script matrix (stub launchctl; the apply proof is macOS-only)
        run: python3 -m unittest discover -s tests/instances -v
      - name: QMD pin, collections, skill and profile matrix (no qmd binary)
        run: python3 -m unittest discover -s tests/qmd -v
      - name: Profile coverage table matches chezmoi managed (macOS-only rows skipped here)
        run: python3 -m unittest discover -s tests/profiles -v
      - name: Canonical skill sync (real chezmoi, throwaway source and HOME)
        run: python3 -m unittest discover -s tests/sync-harness-skills -v
      - name: viz core and boundary tests (render tests skip without chromium and mmdc)
        run: python3 -m unittest discover -s tests/viz -v

  # macOS: the kubectl task test puts /usr/bin first on PATH, and the ubuntu runner image
  # ships /usr/bin/kubectl, which makes the task skip itself.
  mise-tests:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install chezmoi and mise (pinned to the dev-machine versions)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.71.1
          curl -fsSL https://mise.run | MISE_VERSION=v2026.7.18 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Includes one expectedFailure (termux palette extra-keys label).
      - name: Mise task tests
        run: python3 -m unittest discover -s tests/mise -v
      - name: Instances scratch-HOME apply proof (stub launchctl, exact call lists)
        run: python3 -m unittest discover -s tests/instances -v
      - name: Work-Mac adoption script (scratch HOME, real chezmoi and git, stub launchctl)
        run: python3 -m unittest discover -s tests/work-mac-instances -v
      - name: Profile coverage table, macOS-only rows included
        run: python3 -m unittest discover -s tests/profiles -v

name: CI

# Linux tests (job `tests`), the release-pin check (job `release-pins`) and macOS mise tests (job `mise-tests`).
# `tests` runs scripts/ci-linux.sh, which installs nothing: CI installs chezmoi and the apt packages first.
# chezmoi and mise come from scripts/ci-install-tool.sh (pinned release file, retried, sha256 in scripts/ci-tool-pins.txt), not from the tools' install-script sites.
# Not run here: *proof.py / journey scripts that drive a real Pi, Herdr or phone, and
# anything needing 1Password or other secrets (tests/native-mcp, tests/standing-reminder, ...).
# Every test file (test_*.py, *_test.py, *.test.ts/mjs/js, *.spec.*) is run by this workflow or scripts/ci-linux.sh, or named with its reason in
# scripts/ci-not-run.txt; tests/ci-coverage (scripts/check-ci-coverage.py) fails on one that is neither.
#
# Every run (pull request, push to main, and workflow_dispatch to start an untested main by hand) runs `tests`, `release-pins` and
# `mise-tests`. The macOS job has no path filter: a path list goes stale, and a filtered required check hangs as "expected".
# Branch protection requires `tests` and `mise-tests`, so a red `mise-tests` blocks a merge. `release-pins` is not required.
# `~/.local/bin/ci-main-status` (source: dot_local/bin/executable_ci-main-status) reads the main runs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read # job release-pins: check-release-pins.py reads the published versions of the private @cartwmic/agent-kit package

# PR runs cancel the superseded run of the same PR. Main runs (push and workflow_dispatch both use
# refs/heads/main) share one group that never cancels: GitHub keeps one running and one pending, and a
# newer pending run replaces the older pending one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # New Linux suites go in scripts/ci-linux.sh (the ci-par.py list, or its timing-bound tail), not as new steps
  # here. Main's old inline steps are gone; the list in scripts/ci-linux.sh is the one source.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0 # the two commit-walk steps below read every commit of the PR
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - uses: actions/setup-node@v7
        with:
          node-version: "24" # a Pi extension's test runs as TypeScript (node 22.6+ strips the types)
      - name: Install chezmoi (render test uses it)
        run: |
          set -euo pipefail
          scripts/ci-install-tool.sh chezmoi
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chezmoi" --version
      - name: apt packages for the Linux suites (zsh, lsof, rsync, openssh-server, bubblewrap)
        run: sudo apt-get install -y -qq zsh lsof rsync openssh-server bubblewrap >/dev/null
      # A commit that cuts text from an existing test needs a `Test-edit:` line in its message (dotfiles#629 commit 236a1ce). Its own unit
      # suite is tests/test-edit-check, in scripts/ci-linux.sh. PRs only: it needs the PR's base, and main has none.
      - name: "Test edits: fail when a commit removes text from an existing test and says nothing (scripts/check-test-edits.py)"
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/check-test-edits.py "$BASE_SHA" "$HEAD_SHA"
      - name: "Linux checks: scripts/ci-linux.sh (the node tests, then every Linux Python suite via scripts/ci-par.py)"
        run: scripts/ci-linux.sh
      # A pull request that changes what a Python script does needs a test that notices each changed hunk (dotfiles#641: two fix
      # commits added tests, none for the loop rule they rewrote, and review round 2 found the regression there). It undoes each hunk
      # in a copy of HEAD and runs the tests that name the script. Its own unit suite is tests/untested-hunks-check. After the suites,
      # whatever they did, so a red here never hides a red suite (and the reverse). PRs only, like the step above.
      - name: "Untested hunks: fail when the pull request changes a script and no test depends on a changed hunk (scripts/check-untested-hunks.py)"
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        timeout-minutes: 30 # the checker stops its own run at 1500 s (UNTESTED_HUNKS_BUDGET) and prints NOT CHECKED for the rest; a test file stops at 600 s (UNTESTED_HUNKS_TIMEOUT)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          XDG_STATE_HOME: ${{ runner.temp }}/state # the check appends its record to $XDG_STATE_HOME/check-untested-hunks/log.jsonl; the next step keeps it
        run: python3 -u scripts/check-untested-hunks.py "$BASE_SHA" "$HEAD_SHA"
      # The runner is thrown away when the job ends, so the check's record (one JSON line per run: outcome, counts, and the paths that
      # failed, were not checked or were declared) is kept as a workflow artifact. The check also writes it to the run's summary page.
      - name: "Untested hunks: keep the check's record (log.jsonl) as a workflow artifact"
        if: ${{ always() && github.event_name == 'pull_request' }}
        uses: actions/upload-artifact@v7
        with:
          name: check-untested-hunks-log
          path: ${{ runner.temp }}/state/check-untested-hunks/log.jsonl
          if-no-files-found: warn

  # Its own job, so a lagging pin turns the run red without stopping `tests` from running and reporting on its own merits
  # (2026-11-17: two releases three minutes apart each blocked the other's bump PR, and every open PR's suites never ran).
  # Not in scripts/ci-linux.sh: it reads GitHub through gh, and kgate pods run ci-linux.sh with no gh login.
  # Main's run reads red while a pin lags with no open bump PR for it (ci-main-status sees the run, not one job).
  # Branch protection requires `tests` and `mise-tests`, not this job, so a PR with a lagging pin is not blocked from merging; the red main is
  # what stops the next merge.
  release-pins:
    runs-on: ubuntu-latest
    # A job's own permissions replace the top-level block, so this lists every scope the job uses:
    # packages reads the agent-kit versions; pull-requests reads the open dotfiles PRs and their diffs when a pin lags.
    permissions:
      contents: read
      packages: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # ci-main-status matches this step name (PINS_STEP) to recognise the pin-fix PR; tests/ci-main-status checks the two match.
      - name: "Release pins: fail when a Loop Engine or agent-kit pin lags the latest release (playbook 7c57de5a)"
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check-release-pins.py

  # macOS: the kubectl task test puts /usr/bin first on PATH, and the ubuntu runner image
  # ships /usr/bin/kubectl, which makes the task skip itself.
  mise-tests:
    # Pinned: since 2026-11-04 ~15:00Z GitHub assigns no runner to macos-latest (macos-26-arm64) or macos-26;
    # jobs queue unassigned and are cancelled. macos-15 still gets runners (probe PR #170). Move back to
    # macos-latest once its jobs are placed again.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install chezmoi and mise (pinned to the dev-machine versions)
        run: |
          set -euo pipefail
          scripts/ci-install-tool.sh chezmoi
          scripts/ci-install-tool.sh mise
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/chezmoi" --version
          "$HOME/.local/bin/mise" --version
      # Includes one expectedFailure (termux palette extra-keys label).
      - name: Mise task tests
        run: python3 -m unittest discover -s tests/mise -v
      - name: Instances scratch-HOME apply proof (stub launchctl, exact call lists)
        run: python3 -m unittest discover -s tests/instances -v
      - name: Work-Mac adoption script (scratch HOME, real chezmoi and git, stub launchctl)
        run: python3 -m unittest discover -s tests/work-mac-instances -v
      - name: LaunchAgent reload helper (wait for the bootout, retry the bootstrap; fake launchctl, real chezmoi)
        run: python3 -m unittest discover -s tests/launchd-reload -v
      - name: Spotlight-off script (fake mdutil)
        run: python3 -m unittest discover -s tests/spotlight-workshop -v
      - name: Agent scratch on Workshop (create script included; the rest as on Linux)
        run: python3 -m unittest discover -s tests/agent-scratch -v
      - name: agent-events gates and load script on macOS (managed sets per profile, stub launchctl)
        run: python3 -m unittest discover -s tests/agent-events -v
      - name: Profile coverage table, macOS-only rows included
        run: python3 -m unittest discover -s tests/profiles -v
      - name: T3 hub provider instances, apply on and off in a scratch HOME (real chezmoi and jq)
        run: python3 -m unittest discover -s tests/t3-hub -v
      - name: CLIProxy hub as the default, real apply of the three targets in a scratch HOME (real chezmoi and jq)
        run: python3 -m unittest discover -s tests/hub -v
      - name: pnpm store-dir on Workshop (managed sets per profile; real pnpm is not installed here)
        run: python3 -m unittest discover -s tests/pnpm-store -v
      - name: Agent browser render on macOS (MCP entry and launcher present on both profiles)
        run: python3 -m unittest discover -s tests/agent-browser -v
      - name: Agent docker config on macOS (real apply in a scratch HOME on both profiles, real chezmoi)
        run: python3 -m unittest discover -s tests/agent-docker -v

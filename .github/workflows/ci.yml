name: CI

# Linux tests (job `tests`) and macOS mise tests (job `mise-tests`).
# `tests` runs scripts/ci-linux.sh, which installs nothing: CI installs chezmoi and the apt packages first.
# Not run here: *proof.py / journey scripts that drive a real Pi, Herdr or phone, and
# anything needing 1Password or other secrets (tests/native-mcp, tests/standing-reminder, ...).
#
# Every PR runs `tests` (the fast check). Main runs (push, and workflow_dispatch to start an untested main
# by hand) run `tests` and `mise-tests`. `~/.local/bin/ci-main-status` (source: dot_local/bin/executable_ci-main-status)
# reads the main runs.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# PR runs cancel the superseded run of the same PR. Main runs (push and workflow_dispatch both use
# refs/heads/main) share one group that never cancels: GitHub keeps one running and one pending, and a
# newer pending run replaces the older pending one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # New Linux suites go in scripts/ci-linux.sh (the ci-par.py list, or its timing-bound tail), not as new steps
  # here. Main's old inline steps are gone; the list in scripts/ci-linux.sh is the one source.
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install chezmoi (render test uses it)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.71.1
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: apt packages for the Linux suites (zsh, lsof, rsync)
        run: sudo apt-get install -y -qq zsh lsof rsync >/dev/null
      - name: "Linux checks: scripts/ci-linux.sh (four node tests, then every Linux Python suite via scripts/ci-par.py)"
        run: scripts/ci-linux.sh

  # macOS: the kubectl task test puts /usr/bin first on PATH, and the ubuntu runner image
  # ships /usr/bin/kubectl, which makes the task skip itself.
  mise-tests:
    if: github.event_name != 'pull_request'
    # Pinned: since 2026-11-04 ~15:00Z GitHub assigns no runner to macos-latest (macos-26-arm64) or macos-26;
    # jobs queue unassigned and are cancelled. macos-15 still gets runners (probe PR #170). Move back to
    # macos-latest once its jobs are placed again.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Install chezmoi and mise (pinned to the dev-machine versions)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.local/bin"
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$HOME/.local/bin" -t v2.71.1
          curl -fsSL https://mise.run | MISE_VERSION=v2026.7.18 sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # Includes one expectedFailure (termux palette extra-keys label).
      - name: Mise task tests
        run: python3 -m unittest discover -s tests/mise -v
      - name: Instances scratch-HOME apply proof (stub launchctl, exact call lists)
        run: python3 -m unittest discover -s tests/instances -v
      - name: Work-Mac adoption script (scratch HOME, real chezmoi and git, stub launchctl)
        run: python3 -m unittest discover -s tests/work-mac-instances -v
      - name: LaunchAgent reload helper (wait for the bootout, retry the bootstrap; fake launchctl, real chezmoi)
        run: python3 -m unittest discover -s tests/launchd-reload -v
      - name: Spotlight-off script (fake mdutil)
        run: python3 -m unittest discover -s tests/spotlight-workshop -v
      - name: Agent scratch on Workshop (create script included; the rest as on Linux)
        run: python3 -m unittest discover -s tests/agent-scratch -v
      - name: agent-events gates and load script on macOS (managed sets per profile, stub launchctl)
        run: python3 -m unittest discover -s tests/agent-events -v
      - name: Profile coverage table, macOS-only rows included
        run: python3 -m unittest discover -s tests/profiles -v
      - name: T3 hub provider instances, apply on and off in a scratch HOME (real chezmoi and jq)
        run: python3 -m unittest discover -s tests/t3-hub -v
      - name: CLIProxy hub as the default, real apply of the three targets in a scratch HOME (real chezmoi and jq)
        run: python3 -m unittest discover -s tests/hub -v
      - name: pnpm store-dir on Workshop (managed sets per profile; real pnpm is not installed here)
        run: python3 -m unittest discover -s tests/pnpm-store -v
      - name: Agent browser render on macOS (MCP entry and launcher present on both profiles)
        run: python3 -m unittest discover -s tests/agent-browser -v
      - name: Agent docker config on macOS (real apply in a scratch HOME on both profiles, real chezmoi)
        run: python3 -m unittest discover -s tests/agent-docker -v

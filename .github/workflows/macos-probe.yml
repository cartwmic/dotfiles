name: macOS runner probe
# Temporary: which hosted macOS images get a runner. Delete after the diagnosis.
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - run: uname -a && sw_vers 2>/dev/null || true

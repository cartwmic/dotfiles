[rustdesk]
port = 21116
publicKey = "RCVcc2g81tREfvN6ifSx0KSSFgGuG2yhN2OpThmfYqI="
passwordReference = "op://developer/RustDesk/password"

# T3 hub test instances claude-hub and codex-hub (README "T3 hub providers"). Retired: false removes them on the next apply; the
# code stays so true brings them back. Override locally with data t3Hub.enabled.
[t3Hub]
enabled = false

# Homelab CLIProxyAPI hub (https://cliproxy.internal.cartwmic.com) as the default for every Claude Code and Codex session on the
# personal profile (macOS and Linux): ~/.claude/settings.json (dot_claude/modify_settings.json.tmpl), ~/.codex/config.toml
# (dot_codex/modify_private_config.toml.tmpl) and the T3 `codex` instance (dot_t3/private_userdata/modify_settings.json.tmpl).
# Rollback: set enabled = false, then apply those three files. Independent of t3Hub.enabled, which only owns the two test instances.
[hub]
enabled = true

# The Chromium that ~/.local/bin/chromium (Pi launch_browser) runs: Playwright's Chrome for Testing. The wrapper installs it
# with `npx -y playwright@<version> install chromium` when `chromium-<build>` is missing from the Playwright cache. Bump both
# together: <build> is the revision that <version> downloads (read it from the install output or ~/Library/Caches/ms-playwright).
[playwrightChromium]
version = "1.64.1"
build = "1248"

# The T3 release that container mode (the agent host pods) installs: `05_container_tools.sh` passes it to install_t3.sh, which reinstalls when
# `t3 --version` differs. T3 refuses a link between two T3s whose versions differ, so keep it equal to the T3 on the machine that links to the pods
# (omarchy's `t3 --version`) and to the pin in the budget-steward Dockerfile. sha256: the linux lines of
# https://github.com/pingdotgg/t3code/releases/download/v<version>/SHA256SUMS. Changing any value reruns script 05 on the next pod start; a wrong
# sha256 fails that apply, and the pod does not start. Host installs (script 74) ignore this table.
[t3Pin]
version = "0.1.10-nightly.20261116.4800"
sha256X64 = "b55a3c723a30ea4d16b965c426d1bf87b0bb4cfbbdfed5edf5bcfd2fba632f8a"
sha256Arm64 = "8567dc1b5756cac178cf6f688d8faf2382e340eefda14e14b7a91a1aef97e866"

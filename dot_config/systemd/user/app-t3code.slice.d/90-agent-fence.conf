# Fence for the agent sessions on omarchy (a Kubernetes control-plane node with 32 GB RAM). Throttles only: no MemoryMax, nothing that kills a process.
# Why on app-t3code.slice and not on its child app-t3code-agents.slice: T3 runs `systemctl --user set-property --runtime app-t3code-agents.slice MemoryHigh=... MemoryMax=...`
# at every server start (RAM minus 6 GiB / minus 4 GiB), and that call changes the live value, so a drop-in on the child is undone at each T3 start until the next
# daemon-reload. T3 writes only CPUWeight, IOWeight and TasksMax on this parent, and a limit on a parent binds everything under it (T3's server runs in t3code.service, outside it).
# The 90- name sorts after T3's 50-*.conf files, so this file wins at every reload.
[Slice]
# MemoryHigh: above it the kernel reclaims the agents' pages (swap, cache) and slows their allocations; it never kills. Measured 2026-11-16: the agents' RAM use peaked at
# 17.2 GiB in 21 h and sat near 9.7 GiB resident (10 GiB more in zram swap); the rest of the box (kubepods, system, desktop) holds about 16.5 GiB of the 31.1 GiB. 12G leaves
# the steady state alone and cuts bursts above 12 GiB, where T3's own limit (25 GiB) never acted. Sized for this box; change it if its RAM changes.
MemoryHigh=12G
# CPUWeight: the same 10 that T3 sets on this slice at start (against 100 for its siblings), kept here so it does not depend on T3 having started.
CPUWeight=10

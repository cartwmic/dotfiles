# mise.toml - Universal Development Environment Configuration
# Complete replacement for run_onchange_bootstrap_env.sh
#
# Installation:
#   macOS:   brew install mise
#   Ubuntu:  curl https://mise.run | sh
#
# Usage:
#   mise install              # Install all tools
#   mise run bootstrap        # Run full bootstrap including custom tasks
#   mise upgrade              # Upgrade all tools
#
# IMPORTANT: Add to ~/.zshrc EARLY (before other version managers):
#   eval "$(mise activate zsh)"

# =============================================================================
# Tool Aliases
# =============================================================================
# Loop Engine publishes independent CLI and provider archives from one release.
# Separate aliases give each binary its own mise install directory.
[tool_alias]
loop-engine = "github:cartwmic/loop-engine"
software-change = "github:cartwmic/loop-engine"

# =============================================================================
# Core Language Runtimes
# =============================================================================
[tools]
# NOTE: rust is deliberately NOT managed by mise.
# mise's rust backend is a thin wrapper over rustup and unconditionally exports
# RUSTUP_TOOLCHAIN=<resolved version> into the environment. rustup's resolution
# order puts that env var ABOVE a repo's rust-toolchain.toml, so a global mise
# rust pin silently shadows every project toolchain pin (see `mise env`).
# Instead, rustup is installed by the install-rust task and owns toolchain
# resolution, so rust-toolchain.toml works everywhere. See docs/lang/rust.html.
python = "latest" # System Python
node = "lts"      # Replaces nvm
zig = "0.15.2"    # Pinned: builds the cartwmic/claude-p fork (pi-claude-bridge build-on-install)

# =============================================================================
# Shell & Terminal Tools
# =============================================================================
starship = "latest"                       # Shell prompt
zellij = "latest"                         # General-purpose terminal multiplexer
"github:herdrdev/herdr" = "0.7.5"         # Agent-aware workspace manager; pin client/server protocol
zoxide = "latest"                         # Smart cd replacement

# Zsh tools
"github:junegunn/fzf" = "latest" # Fuzzy finder (has binary releases)
# antidote and fzf-tab are pure zsh scripts (no binary releases), installed via tasks

# =============================================================================
# Development Tools
# =============================================================================
neovim = "latest"  # Editor
lazygit = "latest" # Git TUI
gh = "latest"      # GitHub CLI; also git credential helper (gh auth login is a manual post-provision step)
ripgrep = "latest" # Fast grep alternative

# Durable workflow engine and matching reference provider. Keep versions paired.
loop-engine = { version = "0.4.0", matching_regex = "^loop-cli-", rename_exe = "loop-engine" }
software-change = { version = "0.4.0", matching_regex = "^software-change-provider-", rename_exe = "software-change" }

# Build tools & task runners
"github:go-task/task" = "latest" # Go-based task runner

# =============================================================================
# Kubernetes Tools
# =============================================================================
# kubectl installed via task due to SSL issues with aqua backend in some environments
k9s = "latest"                                  # Kubernetes TUI
helm = "latest"                                 # Kubernetes package manager
kustomize = "latest"                            # Kubernetes config management
"github:bitnami-labs/sealed-secrets" = "latest" # kubeseal

# =============================================================================
# Infrastructure & Cloud
# =============================================================================
terraform = "latest" # Infrastructure as Code

# =============================================================================
# Data Processing
# =============================================================================
jq = "latest" # JSON processor
yq = "latest" # YAML processor

# =============================================================================
# Security & Encryption
# =============================================================================
# cargo:rage configured in [tools."cargo:rage"] section below

# =============================================================================
# AI & Productivity Tools
# =============================================================================
"github:rtk-ai/rtk" = "latest" # RTK - Rust Token Killer (AI coding agent proxy)
shellcheck = "latest"
# mermaid-cli and claude-code-acp installed via tasks to ensure node is available first

# =============================================================================
# Tool Options
# =============================================================================
# cargo:rage moved to tasks to ensure build-essential is installed first

# =============================================================================
# Environment Variables
# =============================================================================
[env]
# mise will manage PATH automatically

# =============================================================================
# Custom Installation Tasks
# =============================================================================

[tasks."setup-ubuntu-essentials"]
description = "Install Ubuntu base packages and set zsh as default shell"
run = '''
OS="$(uname -s)"
case "$OS" in
  Linux)
    # Check if build-essential is installed
    if ! dpkg -l | grep -q "^ii  build-essential"; then
      echo "Installing Ubuntu essential packages..."
      sudo apt-get update
      sudo apt-get install -y build-essential software-properties-common jq tar curl wget \
        git sed gnupg zip zsh fontconfig util-linux bison mercurial wl-clipboard
    else
      echo "build-essential already installed"
    fi
    # Set zsh as default shell if not already
    if [ "$SHELL" != "/usr/bin/zsh" ] && [ -x /usr/bin/zsh ]; then
      sudo chsh "$USER" -s /usr/bin/zsh
    fi
    ;;
esac
'''

[tasks."install-uv"]
description = "Install uv (Python package installer)"
run = '''
if ! command -v uv >/dev/null 2>&1; then
  curl -LsSf https://astral.sh/uv/install.sh | sh
fi
'''

[tasks."install-uv-tools"]
description = "Install Python tools via uv"
depends = ["install-uv"]
run = '''
if ! command -v vectorcode >/dev/null 2>&1 || ! command -v vibe >/dev/null 2>&1; then
  uv tool install vectorcode
  uv tool install mistral-vibe
fi
'''

[tasks."install-nvim-python-host"]
description = "Create dedicated venv with pynvim for Neovim's python3 provider"
# Consumed by ~/.config/nvim/init.lua via vim.g.python3_host_prog.
# Isolates pynvim from system/mise Python so nvim doesn't break when the
# default Python version changes.
run = '''
VENV="$HOME/.local/share/nvim-python"
if [ ! -x "$VENV/bin/python3" ]; then
  python3 -m venv "$VENV"
fi
# Repair partial venvs left without pip instead of treating python3 alone as complete.
if ! "$VENV/bin/python3" -m pip --version >/dev/null 2>&1; then
  "$VENV/bin/python3" -m ensurepip --upgrade
fi
"$VENV/bin/python3" -m pip install --quiet --upgrade pip pynvim
'''

[tasks."install-sdkman"]
description = "Install SDKMAN (Java/JVM tools)"
run = '''
if [ ! -d "$HOME/.sdkman" ]; then
  BASH_BIN="$(command -v bash)"
  # Expansion intentionally occurs inside the selected Bash process.
  # shellcheck disable=SC2016
  if ! "$BASH_BIN" -c 'test "${BASH_VERSINFO[0]}" -ge 4'; then
    case "$(uname -s)" in
      Darwin)
        brew install bash
        BASH_BIN="$(brew --prefix bash)/bin/bash"
        ;;
      *)
        echo "ERROR: SDKMAN requires Bash 4 or newer; found $($BASH_BIN --version | head -n 1)" >&2
        exit 1
        ;;
    esac
  fi
  curl -fsSL "https://get.sdkman.io" | "$BASH_BIN"
fi
'''

[tasks."install-kitty"]
description = "Install Kitty terminal emulator"
run = '''
OS="$(uname -s)"
case "$OS" in
  Darwin)
    if [ ! -d "/Applications/kitty.app" ]; then
      curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
    fi
    ;;
  Linux)
    if [ ! -d "$HOME/.local/kitty.app" ]; then
      curl -L https://sw.kovidgoyal.net/kitty/installer.sh | sh /dev/stdin
    fi
    ;;
esac
'''

[tasks."install-rustdesk"]
description = "Install RustDesk remote desktop on personal macOS or native Ubuntu/Debian hosts"
depends = ["setup-ubuntu-essentials"]
run = '''
PROFILE="$(chezmoi data --format json 2>/dev/null | jq -r '.profile // empty' || true)"
if [ "$PROFILE" != "personal" ]; then
  echo "Skipping RustDesk for chezmoi profile ${PROFILE:-unknown}"
  exit 0
fi

OS="$(uname -s)"
case "$OS" in
  Darwin)
    if [ -d "/Applications/RustDesk.app" ]; then
      echo "RustDesk already installed"
    else
      brew install --cask rustdesk
    fi
    ;;
  Linux)
    if grep -qi microsoft /proc/version 2>/dev/null; then
      echo "Skipping RustDesk inside WSL"
      exit 0
    fi

    if dpkg-query -W -f='${Status}' rustdesk 2>/dev/null | grep -q 'install ok installed'; then
      echo "RustDesk Debian package already installed"
      exit 0
    fi

    if [ ! -r /etc/os-release ]; then
      echo "ERROR: RustDesk installer requires Ubuntu or Debian"
      exit 1
    fi
    # shellcheck disable=SC1091
    . /etc/os-release
    case "${ID:-} ${ID_LIKE:-}" in
      *ubuntu*|*debian*) ;;
      *)
        echo "ERROR: RustDesk installer supports Ubuntu or Debian, found ${ID:-unknown}"
        exit 1
        ;;
    esac

    case "$(dpkg --print-architecture)" in
      amd64) RUSTDESK_ARCH="x86_64" ;;
      arm64) RUSTDESK_ARCH="aarch64" ;;
      *)
        echo "ERROR: unsupported RustDesk architecture: $(dpkg --print-architecture)"
        exit 1
        ;;
    esac

    RELEASE_JSON="$(curl -fsSL https://api.github.com/repos/rustdesk/rustdesk/releases/latest)"
    ASSET_SUFFIX="-${RUSTDESK_ARCH}.deb"
    ASSET_URL="$(printf '%s' "$RELEASE_JSON" | jq -r --arg suffix "$ASSET_SUFFIX" '.assets[] | select(.name | endswith($suffix)) | .browser_download_url' | head -n 1)"
    ASSET_DIGEST="$(printf '%s' "$RELEASE_JSON" | jq -r --arg suffix "$ASSET_SUFFIX" '.assets[] | select(.name | endswith($suffix)) | .digest' | head -n 1)"
    unset RELEASE_JSON

    if [ -z "$ASSET_URL" ] || [ "$ASSET_URL" = "null" ]; then
      echo "ERROR: latest RustDesk release has no ${RUSTDESK_ARCH} Debian package"
      exit 1
    fi

    TEMP_DIR="$(mktemp -d)"
    trap 'rm -rf "$TEMP_DIR"' EXIT HUP INT TERM
    PACKAGE="$TEMP_DIR/rustdesk.deb"
    curl -fL "$ASSET_URL" -o "$PACKAGE"

    case "$ASSET_DIGEST" in
      sha256:*)
        EXPECTED_SHA256="${ASSET_DIGEST#sha256:}"
        ACTUAL_SHA256="$(sha256sum "$PACKAGE" | awk '{print $1}')"
        if [ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]; then
          echo "ERROR: RustDesk package checksum mismatch"
          exit 1
        fi
        ;;
      *)
        echo "ERROR: latest RustDesk release does not publish a SHA-256 digest"
        exit 1
        ;;
    esac

    sudo apt-get install -y "$PACKAGE"
    ;;
  *)
    echo "ERROR: RustDesk installer supports macOS and Linux only"
    exit 1
    ;;
esac
'''

[tasks."install-docker"]
description = "Install Docker Desktop on personal macOS or Docker Engine on personal Ubuntu hosts"
depends = ["setup-ubuntu-essentials"]
# Homebrew and apt may invoke sudo. Give this task exclusive, direct terminal
# access so password prompts do not receive SIGTTIN inside mise's worker pool.
interactive = true
run = '''
PROFILE="$(chezmoi data --format json 2>/dev/null | jq -r '.profile // empty' || true)"
if [ "$PROFILE" != "personal" ]; then
  echo "Skipping Docker for chezmoi profile ${PROFILE:-unknown}"
  exit 0
fi

verify_docker_cli() {
  hash -r 2>/dev/null || true
  if ! command -v docker >/dev/null 2>&1; then
    echo "ERROR: Docker CLI is not available on PATH after installation" >&2
    return 1
  fi
  docker --version
  docker compose version
}

OS="$(uname -s)"
case "$OS" in
  Darwin)
    # Docker Desktop links its CLI into this conventional system path. Repair
    # legacy permissions that prevent non-root users from traversing it.
    ensure_docker_cli_path() {
      if [ -d /usr/local/bin ] && { [ ! -r /usr/local/bin ] || [ ! -x /usr/local/bin ]; }; then
        echo "Repairing inaccessible /usr/local/bin permissions"
        sudo chmod 0755 /usr/local/bin
      fi
    }
    ensure_docker_cli_path

    if [ -d "/Applications/Docker.app" ] && command -v docker >/dev/null 2>&1; then
      echo "Docker Desktop already installed"
    elif brew list --cask docker-desktop >/dev/null 2>&1; then
      echo "Repairing incomplete Docker Desktop installation"
      brew reinstall --cask docker-desktop
      echo "Docker Desktop repaired; open it once to accept the license and finish setup"
    else
      brew install --cask docker-desktop
      echo "Docker Desktop installed; open it once to accept the license and finish setup"
    fi
    ensure_docker_cli_path
    verify_docker_cli
    ;;
  Linux)
    if grep -qi microsoft /proc/version 2>/dev/null; then
      echo "Skipping Docker Engine inside WSL; use Docker Desktop integration from Windows"
      exit 0
    fi

    if [ ! -r /etc/os-release ]; then
      echo "Skipping Docker Engine: /etc/os-release is unavailable"
      exit 0
    fi
    # shellcheck disable=SC1091
    . /etc/os-release
    if [ "${ID:-}" != "ubuntu" ]; then
      echo "Skipping Docker Engine on unsupported Linux distribution ${ID:-unknown}"
      exit 0
    fi

    CONFLICTS=""
    for PACKAGE in docker.io docker-compose docker-compose-v2 docker-doc docker-buildx podman-docker containerd runc; do
      if dpkg-query -W -f='${Status}' "$PACKAGE" 2>/dev/null | grep -q 'install ok installed'; then
        CONFLICTS="$CONFLICTS $PACKAGE"
      fi
    done
    if [ -n "$CONFLICTS" ]; then
      echo "ERROR: conflicting Docker packages installed:$CONFLICTS" >&2
      echo "Remove them explicitly before installing Docker CE from Docker's official repository" >&2
      exit 1
    fi

    sudo apt-get update
    sudo apt-get install -y ca-certificates curl
    sudo install -m 0755 -d /etc/apt/keyrings
    sudo curl -fsSL https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
    sudo chmod a+r /etc/apt/keyrings/docker.asc

    CODENAME="${UBUNTU_CODENAME:-${VERSION_CODENAME:-}}"
    if [ -z "$CODENAME" ]; then
      echo "ERROR: unable to determine Ubuntu codename" >&2
      exit 1
    fi
    ARCH="$(dpkg --print-architecture)"
    printf '%s\n' \
      'Types: deb' \
      'URIs: https://download.docker.com/linux/ubuntu' \
      "Suites: $CODENAME" \
      'Components: stable' \
      "Architectures: $ARCH" \
      'Signed-By: /etc/apt/keyrings/docker.asc' \
      | sudo tee /etc/apt/sources.list.d/docker.sources >/dev/null

    sudo apt-get update
    sudo apt-get install -y docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin

    CURRENT_USER="$(id -un)"
    if ! id -nG "$CURRENT_USER" | tr ' ' '\n' | grep -qx docker; then
      sudo usermod -aG docker "$CURRENT_USER"
      echo "Added $CURRENT_USER to docker group; log out and back in before running Docker without sudo"
    fi
    verify_docker_cli
    ;;
  *)
    echo "Skipping Docker on unsupported operating system $OS"
    ;;
esac
'''

[tasks."install-claude"]
description = "Install Claude CLI"
run = '''
if ! command -v claude >/dev/null 2>&1; then
  curl -fsSL https://claude.ai/install.sh | bash
fi
'''

[tasks."install-furi"]
description = "Install furi and register automation-mcp"
run = '''
# Keep prior partial installs usable when this task resumes in a fresh shell.
export PATH="$HOME/.local/bin:$HOME/.bun/bin:$PATH"

if ! command -v furi >/dev/null 2>&1; then
  if ! command -v bun >/dev/null 2>&1; then
    # Chezmoi already manages Bun's PATH block; prevent installer from appending it again.
    curl -fsSL https://bun.sh/install | SHELL=/bin/false bash
    export PATH="$HOME/.bun/bin:$PATH"
  fi

  if ! command -v bun >/dev/null 2>&1; then
    echo "ERROR: bun not found after installation"
    exit 1
  fi

  FURI_SRC_DIR="$HOME/.local/share/furi/src"
  mkdir -p "$(dirname "$FURI_SRC_DIR")"

  if [ ! -d "$FURI_SRC_DIR/.git" ]; then
    git clone --depth 1 https://github.com/ashwwwin/furi "$FURI_SRC_DIR"
  fi

  mkdir -p "$HOME/.local/bin"
  cd "$FURI_SRC_DIR"
  bun install
  bun add -d effect @valibot/to-json-schema
  bun run compile
  cp "$FURI_SRC_DIR/dist/furi" "$HOME/.local/bin/furi"
fi

if ! command -v furi >/dev/null 2>&1; then
  echo "ERROR: furi not found after installation"
  exit 1
fi

AUTOMATION_MCP_DIR="$HOME/.furikake/installed/ashwwwin/automation-mcp"
mkdir -p "$(dirname "$AUTOMATION_MCP_DIR")"

# furi add currently fails for this repo because automation-mcp ships an
# out-of-sync package-lock.json that breaks the npm ci path used by furi.
# Install and register it manually until upstream fixes that path.
if [ ! -d "$AUTOMATION_MCP_DIR/.git" ]; then
  git clone --depth 1 https://github.com/ashwwwin/automation-mcp "$AUTOMATION_MCP_DIR"
fi

cd "$AUTOMATION_MCP_DIR"
bun install
npm rebuild node-mac-permissions

cat > "$AUTOMATION_MCP_DIR/furi-start.sh" <<'SH'
#!/bin/sh
set -eu
exec bun run index.ts --stdio
SH
chmod +x "$AUTOMATION_MCP_DIR/furi-start.sh"

cat > "$AUTOMATION_MCP_DIR/furi-transport-wrapper.mjs" <<'JS'
#!/usr/bin/env node
import { spawn } from "child_process";
import fs from "fs";
import net from "net";
import path from "path";
import { fileURLToPath } from "url";

const __filename = fileURLToPath(import.meta.url);
const __dirname = path.dirname(__filename);
const socketPath = path.join(process.env.HOME, ".furikake", "transport", "furi_ashwwwin-automation-mcp.sock");
const wrapperArgs = process.argv.slice(2);
const originalCommand = wrapperArgs.length > 0 ? wrapperArgs.join(" ") : "./furi-start.sh";

const transportDir = path.dirname(socketPath);
if (!fs.existsSync(transportDir)) {
  fs.mkdirSync(transportDir, { recursive: true });
}

if (fs.existsSync(socketPath)) {
  fs.unlinkSync(socketPath);
}

const mcpProcess = spawn("sh", ["-c", originalCommand], {
  cwd: __dirname,
  env: { ...process.env, NODE_OPTIONS: "--no-warnings" },
  stdio: "pipe",
});

mcpProcess.stdout.on("data", (data) => process.stdout.write(data));
mcpProcess.stderr.on("data", (data) => process.stderr.write(data));
process.stdin.pipe(mcpProcess.stdin);

mcpProcess.stdout.on("error", () => {});
mcpProcess.stdin.on("error", () => {});

const server = net.createServer((socket) => {
  socket.on("error", () => {});
  socket.pipe(mcpProcess.stdin, { end: false });
  mcpProcess.stdout.pipe(socket, { end: false });
});

server.listen(socketPath, () => {
  fs.chmodSync(socketPath, "666");
});

const cleanup = () => {
  if (fs.existsSync(socketPath)) {
    fs.unlinkSync(socketPath);
  }
  if (!mcpProcess.killed) {
    mcpProcess.kill();
  }
};

process.on("SIGINT", cleanup);
process.on("SIGTERM", cleanup);
mcpProcess.on("exit", (code) => {
  cleanup();
  process.exit(code || 0);
});
JS
chmod +x "$AUTOMATION_MCP_DIR/furi-transport-wrapper.mjs"

python3 - <<'PY'
import json
import pathlib

home = pathlib.Path.home()
config_path = home / ".furikake" / "configuration.json"
config = {}

if config_path.exists() and config_path.read_text().strip():
    config = json.loads(config_path.read_text())

config.setdefault("installed", {})
config["installed"]["ashwwwin/automation-mcp"] = {
    "run": "node furi-transport-wrapper.mjs",
    "source": str(home / ".furikake" / "installed" / "ashwwwin" / "automation-mcp"),
    "socketPath": str(home / ".furikake" / "transport" / "furi_ashwwwin-automation-mcp.sock"),
    "originalRun": "./furi-start.sh",
    "transportWrapper": True,
}

config_path.write_text(json.dumps(config, indent=2) + "\n")
PY

if ! furi status ashwwwin/automation-mcp >/dev/null 2>&1; then
  furi start ashwwwin/automation-mcp
fi
'''

[tasks."install-antidote"]
description = "Install antidote zsh plugin manager"
run = '''
if [ ! -d "$HOME/.antidote" ]; then
  git clone --depth=1 https://github.com/mattmc3/antidote.git "$HOME/.antidote"
fi
'''

[tasks."install-fzf-tab"]
description = "Install fzf-tab completion plugin"
depends = ["install-antidote"]
run = '''
# fzf-tab is installed via antidote in .zshrc
# This task ensures antidote is ready for it
if [ ! -d "$HOME/.antidote" ]; then
  echo "antidote not installed, run install-antidote task first"
  exit 1
fi
'''

[tasks."install-rust"]
description = "Install rustup + stable toolchain (rustup owns toolchain resolution)"
run = '''
set -euo pipefail

# rustup, not mise, manages Rust here. mise's rust backend exports
# RUSTUP_TOOLCHAIN, which overrides any repo-level rust-toolchain.toml.
if ! command -v rustup >/dev/null 2>&1 && [ ! -x "$HOME/.cargo/bin/rustup" ]; then
  echo "Installing rustup..."
  curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
    | sh -s -- -y --no-modify-path --default-toolchain stable --profile default
fi

# dot_zshenv sources this for interactive shells; needed here for the task itself
[ -f "$HOME/.cargo/env" ] && . "$HOME/.cargo/env"

rustup default stable
# wasm32-wasip1 is required to build the harpoon Zellij plugin from source
rustup target add wasm32-wasip1

echo "✅ rustup $(rustup --version 2>/dev/null | head -1)"
'''

[tasks."install-cargo-tools"]
description = "Install cargo-based tools (rage)"
depends = ["setup-ubuntu-essentials", "install-rust"]
run = '''
# Ensure cargo is available (install-rust should have installed rustup by now)
if ! command -v cargo >/dev/null 2>&1; then
  echo "ERROR: cargo not found. Run: mise run install-rust"
  exit 1
fi

# Install rage
if ! command -v rage >/dev/null 2>&1; then
  cargo install rage --locked
fi

# Install kickstart
if ! command -v kickstart >/dev/null 2>&1; then
  cargo install kickstart --features=cli
fi
'''

[tasks."install-kubectl"]
description = "Install kubectl CLI"
run = '''
if ! command -v kubectl >/dev/null 2>&1; then
  VERSION=$(curl -L -s https://dl.k8s.io/release/stable.txt 2>/dev/null || echo "v1.31.0")
  curl -LO "https://dl.k8s.io/release/${VERSION}/bin/linux/amd64/kubectl" || curl -k -LO "https://dl.k8s.io/release/${VERSION}/bin/linux/amd64/kubectl"
  chmod +x kubectl
  mkdir -p "$HOME/.local/bin"
  mv kubectl "$HOME/.local/bin/"
fi
'''

[tasks."install-claude-code-acp"]
description = "Install Claude Code ACP"
run = '''
if ! command -v claude-code-acp >/dev/null 2>&1; then
  # Ensure npm is available
  if ! command -v npm >/dev/null 2>&1; then
    echo "ERROR: npm not found. Node.js must be installed first."
    exit 1
  fi
  npm install -g @zed-industries/claude-code-acp
fi
'''

[tasks."install-pi"]
description = "Install Pi coding agent"
run = '''
if ! command -v pi >/dev/null 2>&1; then
  if ! command -v npm >/dev/null 2>&1; then
    echo "ERROR: npm not found. Node.js must be installed first."
    exit 1
  fi
  npm install -g @earendil-works/pi-coding-agent
fi
'''

[tasks."install-mermaid-cli"]
description = "Install mermaid-cli (mmdc)"
run = '''
if ! command -v mmdc >/dev/null 2>&1; then
  # Ensure npm is available
  if ! command -v npm >/dev/null 2>&1; then
    echo "ERROR: npm not found. Node.js must be installed first."
    exit 1
  fi
  export PUPPETEER_SKIP_DOWNLOAD=true
  npm install -g @mermaid-js/mermaid-cli
fi
'''


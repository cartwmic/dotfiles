[tasks."install-fonts-ubuntu"]
description = "Install Nerd Fonts on Ubuntu"
depends = ["setup-ubuntu-essentials"]
run = '''
OS="$(uname -s)"
case "$OS" in
  Linux)
    # Check if Source Code Pro Nerd Font is already installed
    if fc-list | grep -qi "SauceCodePro"; then
      exit 0
    fi
    
    # Ensure fontconfig is installed first
    if ! command -v fc-cache >/dev/null 2>&1; then
      sudo apt-get install -y fontconfig
    fi
    
    VERSION=$(curl -s https://api.github.com/repos/ryanoasis/nerd-fonts/tags | jq -r '.[0].name')
    TEMP_DIR=$(mktemp -d)
    cd "$TEMP_DIR"
    curl -L -o SourceCodePro.zip "https://github.com/ryanoasis/nerd-fonts/releases/download/$VERSION/SourceCodePro.zip"
    unzip SourceCodePro.zip
    mkdir -p "$HOME/.local/share/fonts"
    find . -name "*.ttf" -exec mv {} "$HOME/.local/share/fonts/" \;
    fc-cache -fv
    cd - >/dev/null && rm -rf "$TEMP_DIR"
    ;;
esac
'''

[tasks."install-fonts"]
description = "Install fonts for current platform"
depends = ["install-fonts-*"]

[tasks."setup-fzf-shell"]
description = "Setup fzf shell integration"
run = '''
if ! test -f ~/.fzf.zsh; then
  # Clone fzf repo temporarily to get shell integration files
  TEMP_DIR=$(mktemp -d)
  git clone --depth 1 https://github.com/junegunn/fzf.git "$TEMP_DIR"
  # --all enables key bindings and completion, --no-update-rc prevents modifying .zshrc
  "$TEMP_DIR/install" --all --no-update-rc
  rm -rf "$TEMP_DIR"
fi
'''

[tasks."install-nvim-rosetta"]
description = "Install x86_64 neovim under Rosetta for managed Macs where ad-hoc signed arm64 binaries are blocked"
run = '''
PROFILE=$(chezmoi data --format json 2>/dev/null | grep -v "^op " | python3 -c "import json,sys; print(json.load(sys.stdin).get('profile',''))" 2>/dev/null || echo "")
if [ "$PROFILE" != "axon-work-computer" ]; then
  echo "Skipping: profile is '$PROFILE', not 'axon-work-computer'"
  exit 0
fi

# Disable mise-managed neovim via env var in ~/.zshenv.local (not managed by chezmoi).
# This prevents mise activate from adding the arm64 binary to PATH.
# Must run before the idempotency check so it's always applied.
ENV_FILE="$HOME/.zshenv.local"
if ! grep -qF "MISE_DISABLE_TOOLS" "$ENV_FILE" 2>/dev/null; then
  echo "# Added by install-nvim-rosetta: disable mise neovim (arm64 blocked by macOS code signing)" >> "$ENV_FILE"
  echo 'export MISE_DISABLE_TOOLS=neovim' >> "$ENV_FILE"
  echo "Added MISE_DISABLE_TOOLS=neovim to $ENV_FILE"
fi

INSTALL_DIR="$HOME/.local/share/nvim-x86_64"
WRAPPER="$HOME/.local/bin/nvim"
# Get target version: check mise config, then fall back to latest GitHub release
VERSION=$(MISE_DISABLE_TOOLS= mise current neovim 2>/dev/null || \
  curl -sL https://api.github.com/repos/neovim/neovim/releases/latest | python3 -c "import json,sys; print(json.load(sys.stdin)['tag_name'].lstrip('v'))" 2>/dev/null || \
  echo "0.12.1")

# Skip if already installed at this version
if [ -x "$INSTALL_DIR/bin/nvim" ]; then
  INSTALLED=$($INSTALL_DIR/bin/nvim --version 2>/dev/null | head -1 | awk '{print $2}' || echo "")
  if [ "v$VERSION" = "$INSTALLED" ] && [ -x "$WRAPPER" ]; then
    echo "nvim x86_64 v$VERSION already installed"
    exit 0
  fi
fi

echo "Installing neovim $VERSION (x86_64) for Rosetta..."
TEMP_DIR=$(mktemp -d)
trap "rm -rf $TEMP_DIR" EXIT
curl -sL "https://github.com/neovim/neovim/releases/download/v${VERSION}/nvim-macos-x86_64.tar.gz" -o "$TEMP_DIR/nvim.tar.gz"
tar xzf "$TEMP_DIR/nvim.tar.gz" -C "$TEMP_DIR"

rm -rf "$INSTALL_DIR"
mkdir -p "$INSTALL_DIR"
cp -R "$TEMP_DIR/nvim-macos-x86_64/"* "$INSTALL_DIR/"

mkdir -p "$(dirname "$WRAPPER")"
cat > "$WRAPPER" << 'WRAPPER_EOF'
#!/bin/bash
exec arch -x86_64 "$HOME/.local/share/nvim-x86_64/bin/nvim" "$@"
WRAPPER_EOF
chmod +x "$WRAPPER"

echo "✅ nvim x86_64 installed at $INSTALL_DIR"
echo "✅ Wrapper at $WRAPPER (uses Rosetta)"
'''

[tasks."install-zellij-plugins"]
description = "Install/build Zellij plugins (room from release, harpoon from source)"
depends = ["install-rust"]
run = '''
set -euo pipefail

PLUGIN_DIR="$HOME/.config/zellij/plugins"
mkdir -p "$PLUGIN_DIR"

# Pinned versions — bump to upgrade
ROOM_VERSION="v1.2.1"
ZJSTATUS_VERSION="v0.23.0"
ZJSTATUS_HINTS_VERSION="v0.1.4"
# harpoon: pinned to a commit on the cartwmic fork carrying a custom patch
# (see HARPOON_REPO below). Bump both together when re-syncing with upstream.
# Patches: (1) keep focused_pane sticky when harpoon itself has focus, so `a`
# can add multiple panes from the same tab; (2) fullscreen the selected pane on
# jump; plus the filter/jump-modes rewrite (cargo workspace: harpoon-core lib +
# harpoon-plugin wasm crate). Upstream issues: not yet filed.
HARPOON_REPO="https://github.com/cartwmic/harpoon"
HARPOON_VERSION="62d33eeb6e13db6597ba75aa4bb73c662e198d57"

# --- room: prebuilt wasm from GitHub release ---
ROOM_STAMP="$PLUGIN_DIR/.room.version"
if [ ! -f "$PLUGIN_DIR/room.wasm" ] || [ "$(cat "$ROOM_STAMP" 2>/dev/null)" != "$ROOM_VERSION" ]; then
  echo "Installing rvcas/room $ROOM_VERSION..."
  curl -fsSL "https://github.com/rvcas/room/releases/download/${ROOM_VERSION}/room.wasm" \
    -o "$PLUGIN_DIR/room.wasm"
  echo "$ROOM_VERSION" > "$ROOM_STAMP"
else
  echo "room $ROOM_VERSION already installed"
fi

# --- zjstatus: prebuilt wasm from GitHub release (replaces built-in status-bar) ---
ZJSTATUS_STAMP="$PLUGIN_DIR/.zjstatus.version"
if [ ! -f "$PLUGIN_DIR/zjstatus.wasm" ] || [ "$(cat "$ZJSTATUS_STAMP" 2>/dev/null)" != "$ZJSTATUS_VERSION" ]; then
  echo "Installing dj95/zjstatus $ZJSTATUS_VERSION..."
  curl -fsSL "https://github.com/dj95/zjstatus/releases/download/${ZJSTATUS_VERSION}/zjstatus.wasm" \
    -o "$PLUGIN_DIR/zjstatus.wasm"
  echo "$ZJSTATUS_VERSION" > "$ZJSTATUS_STAMP"
else
  echo "zjstatus $ZJSTATUS_VERSION already installed"
fi

# --- zjstatus-hints: prebuilt wasm from GitHub release (keybind hints for zjstatus) ---
ZJSTATUS_HINTS_STAMP="$PLUGIN_DIR/.zjstatus-hints.version"
if [ ! -f "$PLUGIN_DIR/zjstatus-hints.wasm" ] || [ "$(cat "$ZJSTATUS_HINTS_STAMP" 2>/dev/null)" != "$ZJSTATUS_HINTS_VERSION" ]; then
  echo "Installing b0o/zjstatus-hints $ZJSTATUS_HINTS_VERSION..."
  curl -fsSL "https://github.com/b0o/zjstatus-hints/releases/download/${ZJSTATUS_HINTS_VERSION}/zjstatus-hints.wasm" \
    -o "$PLUGIN_DIR/zjstatus-hints.wasm"
  echo "$ZJSTATUS_HINTS_VERSION" > "$ZJSTATUS_HINTS_STAMP"
else
  echo "zjstatus-hints $ZJSTATUS_HINTS_VERSION already installed"
fi

# --- harpoon: build from source (no prebuilt release) ---
HARPOON_STAMP="$PLUGIN_DIR/.harpoon.version"
if [ ! -f "$PLUGIN_DIR/harpoon.wasm" ] || [ "$(cat "$HARPOON_STAMP" 2>/dev/null)" != "$HARPOON_VERSION" ]; then
  echo "Building Nacho114/harpoon $HARPOON_VERSION..."
  # wasm32-wasip1 target is added by the install-rust task (a dependency)

  HARPOON_SRC="$HOME/.local/share/harpoon-zellij/src"
  mkdir -p "$(dirname "$HARPOON_SRC")"
  if [ ! -d "$HARPOON_SRC/.git" ]; then
    git clone "$HARPOON_REPO" "$HARPOON_SRC"
  else
    # Ensure remote URL matches in case it was migrated to/from a fork
    git -C "$HARPOON_SRC" remote set-url origin "$HARPOON_REPO"
  fi
  cd "$HARPOON_SRC"
  git fetch --tags --quiet origin
  git checkout "$HARPOON_VERSION"
  # Cargo workspace (harpoon-core lib + harpoon-plugin wasm crate). The
  # wasm32-wasip1 target pin lives in harpoon-plugin/.cargo/config.toml,
  # which cargo does NOT read from the workspace root, so the target must
  # be passed explicitly. -p harpoon selects the plugin package (its
  # package name is `harpoon`, dir is harpoon-plugin/).
  cargo build --release -p harpoon --target wasm32-wasip1
  cp target/wasm32-wasip1/release/harpoon.wasm "$PLUGIN_DIR/harpoon.wasm"
  echo "$HARPOON_VERSION" > "$HARPOON_STAMP"
else
  echo "harpoon $HARPOON_VERSION already installed"
fi

echo "✅ Zellij plugins installed in $PLUGIN_DIR"
'''


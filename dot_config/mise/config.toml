description = "Complete system bootstrap"
depends = [
  "setup-ubuntu-essentials",
  "install-rust",
  "install-cargo-tools",
  "install-uv",
  "install-uv-tools",
  "install-nvim-python-host",
  "install-sdkman",
  "install-kitty",

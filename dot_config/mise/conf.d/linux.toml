# Linux only (see .chezmoiignore). Omarchy ships Pi as a system mise tool (/etc/mise/conf.d/omarchy-tools.toml, lazy, auto_update 4h).
# These dotfiles run Pi as the managed install in ~/.pi/agent/bin (mise task install-pi), which pi.dev/install.sh refuses to put next to a
# mise-installed Pi. Disabling the tool keeps mise from reinstalling or updating Omarchy's copy; install-pi removes the copy that is there.
[settings]
# Rust: these dotfiles run rustup (task install-rust), never mise's rust. A mise rust leaves shims for cargo, rustc and rustup that shadow ~/.cargo/bin.
disable_tools = ["pi", "rust"]
